<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-stone-100 text-stone-900 dark:bg-stone-950 dark:text-stone-100">

    <nav
        class="fixed top-0 start-0 z-20 w-full border-b border-stone-200 bg-white dark:border-stone-800 dark:bg-stone-900 ">
        <div class="mx-auto flex max-w-screen-xl flex-wrap items-center justify-between p-4 gap-20">
            <div class="text-2xl">BONJOUR: <span class="text-teal-600" id="nomAuteur">Entrer votre nom</span></div>
            <input type="checkbox" id="menu" class="peer sr-only">

            <a href="#" class="flex items-center space-x-3 rtl:space-x-reverse">
                <img src="logo.jpg" class="h-16 rounded-xl" alt="Flowbite Logo" />
                <span class="self-center whitespace-nowrap text-xl font-semibold">WakeLab</span>
            </a>

            <label for="menu"
                class="inline-flex h-10 w-10 cursor-pointer items-center justify-center rounded-lg p-2 text-sm hover:bg-stone-100 focus:outline-none peer-focus-visible:ring-2 peer-focus-visible:ring-indigo-400 md:hidden dark:hover:bg-stone-800">
                <span class="sr-only">Open main menu</span>
                <svg class="h-6 w-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    fill="none" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h14" />
                </svg>
            </label>

            <div class="hidden w-full peer-checked:block md:block md:w-auto" id="navbar-default">
                <ul
                    class="mt-4 flex flex-col rounded-lg border border-stone-200 bg-stone-50 p-4 font-medium md:mt-0 md:flex-row md:space-x-8 md:border-0 md:bg-white md:p-0 rtl:space-x-reverse dark:border-stone-800 dark:bg-stone-800 md:dark:bg-stone-900">
                    <li>
                        <a href="#"
                            class="block rounded bg-indigo-600 px-3 py-2 text-white md:bg-transparent md:p-0 md:text-indigo-600 md:dark:text-indigo-400"
                            aria-current="page">Home</a>
                    </li>
                </ul>
            </div>
            <button type="button" class="bg-teal-700 p-2 cursor-pointer rounded-3xl text-teal-200" id="editNom">Edit
                Votre Nom</button>
        </div>
    </nav>




    <div id="formAjouterNom" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center">
        <div class="  bg-teal-700 w-full max-w-md p-6 rounded-3xl shadow-xl">
            <div id="errorNom"
                class="hidden bg-red-100 text-red-600 border border-red-300 rounded-lg max-w-xl m-auto p-3 text-sm font-medium">
            </div>
            <form id="formNom" class="flex flex-col gap-5 ">
                <label for="nom">Taper votre nom:</label>
                <input required type="text" class="border rounded-md py-2 px-4" id="nom" name="nom"
                    placeholder="Votre nom">
                <button class="bg-red-400 p-2 border rounded-3xl text-red-800 cursor-pointer">Confirm</button>
            </form>
        </div>
    </div>




    <div class="mx-auto max-w-full px-4 py-10 pt-28">
        <form id="forAjoute"
            class="space-y-5 rounded-xl border border-stone-300 bg-white p-6 shadow-sm dark:border-stone-700 dark:bg-stone-800">
            <input type="text" name="checkId" id="checkId" value="" class="hidden">
            <div id="error-message"
                class="hidden bg-red-100 text-red-600 border border-red-300 rounded-lg max-w-xl m-auto p-3 text-sm font-medium">

            </div>


            <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
                <div>
                    <label for="duree" class="mb-1 block text-sm font-medium">duree (10 à 20 min)</label>
                    <input type="number" id="duree" name="duree"
                        class="w-full rounded-lg border border-stone-300 bg-white px-3 py-2 focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-600/40 dark:border-stone-600 dark:bg-stone-900">
                </div>
                <div>
                    <label for="theme" class="mb-1 block text-sm font-medium">theme</label>
                    <select id="theme" name="theme"
                        class="w-full rounded-lg border border-stone-300 bg-white px-3 py-2 focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-600/40 dark:border-stone-600 dark:bg-stone-900">
                        <option value="">Sélectionnez un thème</option>
                        <option value="jeu">jeu</option>
                        <option value="apprentissage">apprentissage</option>
                        <option value="exercice">exercice</option>
                        <option value="autre">autre</option>
                    </select>
                </div>
            </div>

            <div>
                <label for="titre" class="mb-1 block text-sm font-medium">titre</label>
                <input type="text" id="titre" name="titre"
                    class="w-full rounded-lg border border-stone-300 bg-white px-3 py-2 focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-600/40 dark:border-stone-600 dark:bg-stone-900">
            </div>

            <div>
                <label for="description" class="mb-1 block text-sm font-medium">description</label>
                <textarea id="description" name="description" rows="3"
                    class="w-full rounded-lg border border-stone-300 bg-white px-3 py-2 focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-600/40 dark:border-stone-600 dark:bg-stone-900"></textarea>
            </div>

            <div>
                <label for="objectifs" class="mb-1 block text-sm font-medium">objectifs</label>
                <textarea id="objectifs" name="objectifs" rows="2"
                    class="w-full rounded-lg border border-stone-300 bg-white px-3 py-2 focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-600/40 dark:border-stone-600 dark:bg-stone-900"></textarea>
            </div>

            <button type="submit"
                class="w-full rounded-lg bg-teal-700 px-4 py-2.5 font-medium text-white hover:bg-teal-800 focus:outline-none focus:ring-2 focus:ring-teal-600/60 focus:ring-offset-2 dark:focus:ring-offset-stone-800">Enregistrer</button>
        </form>
    </div>

    <div class="flex flex-wrap justify-center align-center gap-20">
        <div class="">
            <label for="rechrcher" class="text-2xl">Rechrcher un activite: </label>
            <input type="text" name="rechrcher" id="rechrcher"
                class=" rounded-lg border border-stone-300 bg-white px-3 py-2 focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-600/40 dark:border-stone-600 dark:bg-stone-900"
                placeholder="activite...">
        </div>
        <select id="rechrcehThem" name=""
            class=" rounded-lg border border-stone-300 bg-white px-3 py-2 focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-600/40 dark:border-stone-600 dark:bg-stone-900">
            <option value="">Sélectionnez un thème</option>
            <option value="jeu">jeu</option>
            <option value="apprentissage">apprentissage</option>
            <option value="exercice">exercice</option>
            <option value="autre">autre</option>
        </select>
    </div>
    <main
        class="mx-auto grid max-w-screen-2xl items-start gap-3 px-4 pt-28 pb-10 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 "
        id="cardsContainer">
        <div class="animate-spin inline-block size-6 border-3 border-current border-t-transparent rounded-[999px] text-muted-foreground-2"
            role="status" aria-label="loading">
            <span class="sr-only">Loading...</span>
        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/axios@1.21.1/dist/axios.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="main.js"></script>
</body>
</body>

</html>
